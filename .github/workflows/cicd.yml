name: CI/CD Pipeline Implementation

# We are specifying the events that will trigger the workflow. In this case, we want to run the workflow on every push and pull request to the main branch.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Here we define the jobs that will run as part of the workflow. Each job can have multiple steps, and each step can run commands or actions.
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # The first step is to check out the code from the repository.
    - name: Checkout code
      uses: actions/checkout@v3

    # The next step is to set up Python. We specify the version of Python we want to use.
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # Now we install the dependencies required for our project.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # After installing dependencies, we run the tests to ensure everything is working as expected.
    - name: Run tests
      run: |
        pytest

  build-and-publish:
    runs-on: ubuntu-latest

    ## This job depends on the successful completion of the build-and-test job. This is specified using the "needs" keyword.
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
      ## These variables are stored as secrets in the GitHub repository settings. This is a secure way to handle sensitive information like usernames and passwords.
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/ci_cd:latest


    - name: Image Digest 
      run: echo "Image Digest: ${{ steps.build-and-publish.outputs.digest }}"